# --- Reproducible-build path (recommended) ------------------------------------
# Publish a signed APK in each GitHub release at this URL and give F-Droid the
# signing-key fingerprint below so it can verify its rebuild against your binary.
# If you'd rather have F-Droid build AND sign with its own key, delete both the
# `Binaries:` and `AllowedAPKSigningKeys:` lines.
