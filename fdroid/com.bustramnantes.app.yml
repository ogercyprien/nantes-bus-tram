# ---------------------------------------------------------------------------
# F-Droid build metadata for "Bus et Tram Nantes".
#
# This file does NOT live in this app repo when published — it belongs in the
# fdroiddata repository at:  metadata/com.bustramnantes.app.yml
# Copy it there (on your fork of https://gitlab.com/fdroid/fdroiddata) on a
# branch named `com.bustramnantes.app`, then open a merge request.
#
# Reproducible build: F-Droid rebuilds each tag, checks it against the signed
# APK attached to the GitHub release (each build's `binary`) and publishes OUR
# signed APK.
# Release flow: bump versionCode/versionName, commit, tag v<versionName>; the
# release workflow signs and attaches app-<abi>-release.apk for every ABI.
#
# One APK per ABI (libmaplibre.so is 8-11 MB per ABI): one build block per ABI,
# `gradleprops: targetAbi=<abi>` builds that ABI alone. Its versionCode is
# 10 * versionCode + digit (armeabi-v7a 1, arm64-v8a 3, x86_64 4 - ABI_DIGITS in
# app/build.gradle.kts). checkupdates copies the last 3 blocks for a new tag and
# gives them the VercodeOperation codes IN ORDER: keep the blocks in that order.
# The APK `-PtargetAbi=<abi>` builds is byte-identical to that ABI's APK from
# the plain build (ABI splits), which is what the release workflow publishes.
#
# AllowedAPKSigningKeys = SHA-256 of the release key's certificate (lowercase hex,
# no colons):  apksigner verify --print-certs app-release.apk | grep SHA-256
#
# Run `fdroid rewritemeta com.bustramnantes.app` and `fdroid lint
# com.bustramnantes.app` to auto-format and validate field order.
# ---------------------------------------------------------------------------

AntiFeatures:
  NonFreeAssets:
    en-US: >-
      For offline use, the app bundles a snapshot of the line overlay tiles of
      the official Naolib map (plan-app.naolib.fr), which are not under a free
      licence.
    fr-FR: >-
      Pour fonctionner hors ligne, l'application embarque une copie des tuiles
      du tracé des lignes de la carte officielle Naolib (plan-app.naolib.fr),
      qui ne sont pas sous licence libre.
  NonFreeNet:
    en-US: >-
      Stops, timetables and itineraries come from the open-data GTFS and work
      offline, but real-time departures come from the Okina gateway and the map's
      line overlay from the official Naolib map service (plan-app.naolib.fr),
      both non-free network services.
    fr-FR: >-
      Arrêts, horaires et itinéraires viennent du GTFS en open data et
      fonctionnent hors ligne, mais le temps réel vient de la passerelle Okina et
      le tracé des lignes sur la carte du service cartographique officiel Naolib
      (plan-app.naolib.fr), deux services réseau non libres.

